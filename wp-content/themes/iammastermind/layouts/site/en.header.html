a-astro-cid-5blmo7yk></div> </header>  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const dropdownWrappers = document.querySelectorAll(".dropdown-wrapper");
    dropdownWrappers.forEach((wrapper) => {
      const btn = wrapper.querySelector("button");
      const content = wrapper.querySelector(".dropdown-content");

      btn?.addEventListener("click", (e) => {
        if (window.innerWidth <= 1024) {
          e.preventDefault();
          const isVisible = content.classList.contains("opacity-100");

          document.querySelectorAll(".dropdown-content").forEach((c) => {
            c.classList.remove("opacity-100", "visible", "translate-y-0");
            c.classList.add("opacity-0", "invisible", "translate-y-4");
          });

          if (!isVisible) {
            content.classList.remove("opacity-0", "invisible", "translate-y-4");
            content.classList.add("opacity-100", "visible", "translate-y-0");
          }
        }
      });
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".dropdown-wrapper") && window.innerWidth <= 1024) {
        document.querySelectorAll(".dropdown-content").forEach((c) => {
          c.classList.remove("opacity-100", "visible", "translate-y-0");
          c.classList.add("opacity-0", "invisible", "translate-y-4");
        });
      }
    });

    // LÓGICA DEL MENÚ LATERAL MÓVIL
    const mobileBtn = document.getElementById("mobile-menu-btn");
    const closeBtn = document.getElementById("close-mobile-btn");
    const offcanvas = document.getElementById("offcanvas-menu");
    const overlay = document.getElementById("mobile-overlay");

    const toggleMenu = () => {
      const isClosed = offcanvas.classList.contains("translate-x-full");
      if (isClosed) {
        offcanvas.classList.remove("translate-x-full");
        overlay.classList.remove("hidden");
        setTimeout(() => overlay.classList.remove("opacity-0"), 10);
        document.body.style.overflow = "hidden";
      } else {
        offcanvas.classList.add("translate-x-full");
        overlay.classList.add("opacity-0");
        setTimeout(() => overlay.classList.add("hidden"), 300);
        document.body.style.overflow = "";
      }
    };

    mobileBtn?.addEventListener("click", toggleMenu);
    closeBtn?.addEventListener("click", toggleMenu);
    overlay?.addEventListener("click", toggleMenu);

    document.querySelectorAll(".mobile-accordion button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const content = btn.nextElementSibling;
        const icon = btn.querySelector("svg");
        content.classList.toggle("hidden");
        content.classList.toggle("flex");
        icon.classList.toggle("rotate-180");
      });
    });
  });
</script> <div class="flex-1">
