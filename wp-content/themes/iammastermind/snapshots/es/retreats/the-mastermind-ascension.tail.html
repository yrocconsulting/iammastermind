<script type="module">function r(){const s={root:null,rootMargin:"0px",threshold:.15},o=new IntersectionObserver(t=>{t.forEach(e=>{e.isIntersecting?e.target.classList.add("is-revealed"):e.target.classList.contains("reveal-bento")&&e.target.classList.remove("is-revealed")})},s);document.querySelectorAll(".reveal-fade-up, .reveal-bento").forEach(t=>{o.observe(t)})}document.addEventListener("astro:page-load",r);</script>
